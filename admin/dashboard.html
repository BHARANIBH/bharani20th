<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Pure Desi Chicken</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; }
        .sidebar {
            width: 250px;
            background: #2d6a2d;
            height: 100vh;
            position: fixed;
            color: white;
            padding: 20px;
        }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 30px; }
        .sidebar nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            transition: background 0.3s;
        }
        .sidebar nav a:hover, .sidebar nav a.active { background: #f5a623; }
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stat-card h3 { font-size: 0.85rem; color: #666; margin-bottom: 10px; }
        .stat-card .number { font-size: 2rem; font-weight: 700; color: #2d6a2d; }
        .recent-orders {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .recent-orders h3 { margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .status-pending { background: #fef3c7; color: #d97706; }
        .status-processing { background: #dbeafe; color: #2563eb; }
        .status-delivered { background: #d1fae5; color: #059669; }
        @media (max-width: 768px) {
            .sidebar { width: 70px; padding: 10px; }
            .sidebar h2 { display: none; }
            .sidebar nav a span { display: none; }
            .sidebar nav a i { font-size: 1.2rem; }
            .main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🐔 Admin Panel</h2>
        <nav>
            <a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a>
            <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
        </nav>
    </div>
    <div class="main-content">
        <h1>Dashboard</h1>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><h3>Total Orders</h3><div class="number" id="totalOrders">-</div></div>
            <div class="stat-card"><h3>Pending</h3><div class="number" id="pendingOrders">-</div></div>
            <div class="stat-card"><h3>Processing</h3><div class="number" id="processingOrders">-</div></div>
            <div class="stat-card"><h3>Delivered</h3><div class="number" id="deliveredOrders">-</div></div>
            <div class="stat-card"><h3>Revenue</h3><div class="number" id="totalRevenue">-</div></div>
        </div>
        <div class="recent-orders">
            <h3>Recent Orders</h3>
            <div style="overflow-x: auto;">
                <table id="ordersTable">
                    <thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead>
                    <tbody id="ordersTableBody"><tr><td colspan="4">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : '/api';
        
        function checkAuth() {
            if (!localStorage.getItem('adminToken')) {
                window.location.href = 'login.html';
            }
        }
        
        async function fetchStats() {
            const response = await fetch(`${API_URL}/admin/stats`);
            const data = await response.json();
            if (data.success) {
                document.getElementById('totalOrders').textContent = data.stats.totalOrders;
                document.getElementById('pendingOrders').textContent = data.stats.pendingOrders;
                document.getElementById('processingOrders').textContent = data.stats.processingOrders;
                document.getElementById('deliveredOrders').textContent = data.stats.deliveredOrders;
                document.getElementById('totalRevenue').textContent = `₹${data.stats.totalRevenue}`;
            }
        }
        
        async function fetchRecentOrders() {
            const response = await fetch(`${API_URL}/admin/orders`);
            const data = await response.json();
            if (data.success) {
                const tbody = document.getElementById('ordersTableBody');
                tbody.innerHTML = data.orders.slice(0, 5).map(order => `
                    <tr>
                        <td>${order.orderId}</td>
                        <td>${order.customerName}</td>
                        <td>₹${order.totalPrice}</td>
                        <td><span class="status-badge status-${order.orderStatus}">${order.orderStatus}</span></td>
                    </tr>
                `).join('');
            }
        }
        
        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'login.html';
        }
        
        checkAuth();
        fetchStats();
        fetchRecentOrders();
    </script>
</body>
</html>
