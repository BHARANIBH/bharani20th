<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Pure Desi Chicken</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f5f5; }
        .sidebar {
            width: 250px;
            background: #2d6a2d;
            height: 100vh;
            position: fixed;
            color: white;
            padding: 20px;
        }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 30px; }
        .sidebar nav a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
        }
        .sidebar nav a:hover, .sidebar nav a.active { background: #f5a623; }
        .main-content { margin-left: 250px; padding: 20px; }
        .orders-table {
            background: white;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        .status-select { padding: 5px 10px; border-radius: 8px; border: 1px solid #ddd; }
        .update-btn { background: #2d6a2d; color: white; border: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
        .view-btn { background: #f5a623; color: white; border: none; padding: 5px 12px; border-radius: 8px; cursor: pointer; margin-right: 5px; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .close { float: right; font-size: 1.5rem; cursor: pointer; }
        @media (max-width: 768px) {
            .sidebar { width: 70px; padding: 10px; }
            .sidebar h2 { display: none; }
            .sidebar nav a span { display: none; }
            .main-content { margin-left: 70px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🐔 Admin Panel</h2>
        <nav>
            <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
            <a href="orders.html" class="active"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a>
            <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
        </nav>
    </div>
    <div class="main-content">
        <h1>Manage Orders</h1>
        <div class="orders-table">
            <table id="ordersTable">
                <thead>
                    <tr><th>Order ID</th><th>Customer</th><th>Phone</th><th>Amount</th><th>Status</th><th>Payment</th><th>Actions</th></tr>
                </thead>
                <tbody id="ordersTableBody"><tr><td colspan="7">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
    <div id="orderModal" class="modal"><div class="modal-content"><span class="close" onclick="closeModal()">&times;</span><div id="modalContent"></div></div></div>
    <script>
        const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : '/api';
        
        function checkAuth() { if (!localStorage.getItem('adminToken')) window.location.href = 'login.html'; }
        
        async function fetchOrders() {
            const response = await fetch(`${API_URL}/admin/orders`);
            const data = await response.json();
            if (data.success) {
                document.getElementById('ordersTableBody').innerHTML = data.orders.map(order => `
                    <tr>
                        <td>${order.orderId}</td>
                        <td>${order.customerName}</td>
                        <td>${order.phone}</td>
                        <td>₹${order.totalPrice}</td>
                        <td>
                            <select class="status-select" id="status-${order.orderId}">
                                <option value="pending" ${order.orderStatus === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="confirmed" ${order.orderStatus === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="processing" ${order.orderStatus === 'processing' ? 'selected' : ''}>Processing</option>
                                <option value="out_for_delivery" ${order.orderStatus === 'out_for_delivery' ? 'selected' : ''}>Out for Delivery</option>
                                <option value="delivered" ${order.orderStatus === 'delivered' ? 'selected' : ''}>Delivered</option>
                                <option value="cancelled" ${order.orderStatus === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                        </td>
                        <td><span class="status-badge">${order.paymentStatus}</span></td>
                        <td>
                            <button class="view-btn" onclick="viewOrder('${order.orderId}')">View</button>
                            <button class="update-btn" onclick="updateOrder('${order.orderId}')">Update</button>
                        </td>
                    </tr>
                `).join('');
            }
        }
        
        async function updateOrder(orderId) {
            const newStatus = document.getElementById(`status-${orderId}`).value;
            const response = await fetch(`${API_URL}/admin/orders/${orderId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ orderStatus: newStatus })
            });
            if (response.ok) alert('Order updated successfully!');
        }
        
        async function viewOrder(orderId) {
            const response = await fetch(`${API_URL}/orders/${orderId}`);
            const data = await response.json();
            if (data.success) {
                const order = data.order;
                document.getElementById('modalContent').innerHTML = `
                    <h3>Order Details</h3>
                    <p><strong>Order ID:</strong> ${order.orderId}</p>
                    <p><strong>Customer:</strong> ${order.customerName}</p>
                    <p><strong>Phone:</strong> ${order.phone}</p>
                    <p><strong>Address:</strong> ${order.address}</p>
                    <p><strong>Delivery Slot:</strong> ${order.deliverySlot}</p>
                    <p><strong>Total:</strong> ₹${order.totalPrice}</p>
                    <p><strong>Payment:</strong> ${order.paymentMethod} (${order.paymentStatus})</p>
                    <p><strong>Status:</strong> ${order.orderStatus}</p>
                    <h4>Products:</h4>
                    <ul>${order.products.map(p => `<li>${p.name} x ${p.quantity} = ₹${p.total}</li>`).join('')}</ul>
                `;
                document.getElementById('orderModal').style.display = 'flex';
            }
        }
        
        function closeModal() { document.getElementById('orderModal').style.display = 'none'; }
        function logout() { localStorage.removeItem('adminToken'); window.location.href = 'login.html'; }
        
        checkAuth();
        fetchOrders();
    </script>
</body>
</html>
